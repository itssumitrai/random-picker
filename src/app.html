<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<meta name="theme-color" content="#f4f4f7" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<script>
			(function () {
				try {
					var stored = localStorage.getItem('spindle.theme');
					var resolved =
						stored === 'light' || stored === 'dark'
							? stored
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.dataset.theme = resolved;
					document.documentElement.style.colorScheme = resolved;
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', resolved === 'dark' ? '#0a0a0e' : '#f4f4f7');
				} catch (error) {
					/* Preferences are optional; the app still works without storage. */
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
